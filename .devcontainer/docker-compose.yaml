services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ..:/workspaces/iam-proxy-demo:cached
    networks:
      - iam-proxy-demo-network  # Attach the dev service here
    tty: true

networks:
  backend-net:
    external: true  # Use 'true' if the network was created outside this file