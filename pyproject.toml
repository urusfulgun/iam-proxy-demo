[project]
name = "iam-proxy-demo"
version = "0.1.0"
description = "Aloysius-style IAM proxy demo: Keycloak brokers SAML2 home IdPs for a FastAPI app over OIDC with PKCE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
iam-proxy-demo = "iam_proxy_demo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "httpx2==2.16.0",
    "mypy>=2.4,<2.5",
    "pytest>=9.2,<10",
    "ruff>=0.17,<0.18",
]

[tool.pytest]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]
markers = ["e2e: needs the running stack; skipped when Keycloak doesn't answer"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
