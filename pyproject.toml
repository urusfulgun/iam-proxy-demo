[project]
name = "iam-proxy-demo"
version = "0.1.0"
description = "Aloysius-style IAM proxy demo: Keycloak brokers SAML2 home IdPs for a FastAPI app over OIDC with PKCE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
iam-proxy-demo = "iam_proxy_demo:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.2,<10",
]
